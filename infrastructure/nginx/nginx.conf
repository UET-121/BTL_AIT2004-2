events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # ─── Rate Limit Zones ──────────────────────────────────────────────────────
    # Lưu trữ trạng thái rate limit trong shared memory (10MB ≈ 160,000 IPs)
    # login_limit: Chống brute-force mật khẩu — 1 req/4s (≈ 15/min) per IP
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=15r/m;
    # api_limit: Giới hạn API chung — 30 req/s per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    # static_limit: Frontend static files — 50 req/s per IP
    limit_req_zone $binary_remote_addr zone=static_limit:10m rate=50r/s;

    # Trả về 429 thay vì 503 khi bị giới hạn
    limit_req_status 429;

    # Ghi log khi rate limit bị kích hoạt (level=warn để tránh spam log)
    limit_req_log_level warn;
    # ──────────────────────────────────────────────────────────────────────────

    # Load Balancer cho Backend API
    upstream backend {
        server backend_api:8000;
    }

    server {
        listen 80;
        # Hỗ trợ mọi truy cập từ localhost (Local) và tên miền (Cloudflare Tunnel)
        # Thay đổi tên miên nếu muốn deploy trên web khác (giữ localhost để test trên máy)
        server_name localhost ddlc.me www.ddlc.me;

        # ─── 1. Login endpoint (strict) ──────────────────────────────────────
        # burst=5: cho phép burst 5 request, nodelay: xử lý ngay không queue
        location = /api/user/login {
            limit_req zone=login_limit burst=5 nodelay;

            proxy_pass http://backend/api/user/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── 2. API Endpoints (general) ──────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── 3. WebSocket Notifications (no rate limit — long-lived connection) ─
        location /ws/ {
            proxy_pass http://backend/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # ─── 4. MediaMTX WHEP (WebRTC) ───────────────────────────────────────
        location /whep/ {
            rewrite ^/whep/(.*) /$1 break;
            proxy_pass http://mediamtx:8889;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── 5. Frontend React (Bản Build tĩnh siêu nhẹ) ────────────────────
        location / {
            limit_req zone=static_limit burst=100 nodelay;

            proxy_pass http://frontend:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ─── 6. Prometheus API (internal only) ────────────────────────────────
        # location /prometheus/ {
        #     proxy_pass http://prometheus:9090/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        # }
    }
}
