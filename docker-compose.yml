services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-plate_recognition}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-plate_recognition}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    env_file:
      - .env
    environment:
      # Overrides to ensure container networking is correct regardless of .env (which might be set for host localhost)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-plate_recognition}
      MINIO_URL: http://minio:9000
      # Other variables will automatically be picked up from .env, but defaults are provided here
      UPLOAD_DIR: /app/uploads
      STORAGE_TYPE: ${STORAGE_TYPE:-minio}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-uploads}
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      PLATE_DETECTION_MODEL: ${PLATE_DETECTION_MODEL:-license_plate_detector.pt}
      DEFAULT_PLATE_REGION: ${DEFAULT_PLATE_REGION:-GB}
      OCR_GPU: ${OCR_GPU:-true}
      USE_ONNX_INFERENCE: ${USE_ONNX_INFERENCE:-true}
      ONNX_MODEL_PATH: ${ONNX_MODEL_PATH:-models/onnx/yolov8-plate-v1.onnx}
      # Reduce PyTorch/MKL thread context-switching overhead inside Docker CPU
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      VECLIB_MAXIMUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
      BACKEND_PROXY_TARGET: ${BACKEND_PROXY_TARGET:-http://api:8000}
      VITE_USE_DEMO_DATA: ${VITE_USE_DEMO_DATA:-false}

volumes:
  pgdata:
  miniodata:

